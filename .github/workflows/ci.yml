name: Build and test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-version.mjs
      - run: node scripts/check-repository.mjs
      - name: Determine verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs
      - name: Scan only the published branch ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          audit_dir=$(mktemp -d)
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir "$audit_dir" --pattern gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check -
          tar -xzf "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git . --log-opts=HEAD --redact=100 --no-banner
  verify:
    needs: secrets
    if: needs.secrets.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: go build -trimpath -o bin/miyohub ./cmd/miyohub
      - run: docker build --tag miyohub:ci .
  develop_image:
    needs: [secrets, verify]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.MIYOHUB_PUBLISH_DEV_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require private scope and a verified source commit
        id: image
        run: node scripts/image-policy.mjs
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish validated development image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:develop
            ${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.title=MiyoHub
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=miyohub-develop
          cache-to: type=gha,mode=max,scope=miyohub-develop
          provenance: mode=min
      - name: Confirm the published package remains private
        run: node scripts/image-policy.mjs --require-package
      - name: Record pull target and digest
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.image }}
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Development image - %s:develop\nPinned image - %s@%s\n' "$PUBLISHED_IMAGE" "$PUBLISHED_IMAGE" "$PUBLISHED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
