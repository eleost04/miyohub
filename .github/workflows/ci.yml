name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only the published branch ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          audit_dir=$(mktemp -d)
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir "$audit_dir" --pattern gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check -
          tar -xzf "$audit_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git . --log-opts=HEAD --redact=100 --no-banner
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test scripts/actions-state.test.mjs
      - run: node scripts/check-version.mjs
      - run: node scripts/check-repository.mjs
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: go build -trimpath -o bin/miyohub ./cmd/miyohub
      - run: docker build --tag miyohub:ci .
