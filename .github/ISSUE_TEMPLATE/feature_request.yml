name: 功能建议 / Feature request
description: 描述使用场景、预期行为和权限边界。
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        提议前请检查功能看板。不要提供真实账号、Cookie、Token、二维码或私有接口凭据。
        Check the roadmap first. Do not include credentials or private account data.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 目前遇到什么限制？哪类用户需要这个能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposal
      description: 描述页面或执行流程，区分用户选项和管理员权限。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与边界 / Alternatives and boundaries
      description: 是否涉及付费服务、公开数据、额外权限或重复扣费风险？
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 建议中不包含个人数据或凭据，且未将上游限制描述为可保证实现的行为。
          required: true
